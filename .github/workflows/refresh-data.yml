name: Refresh PLUTO data

# Runs the data pipeline on a schedule and whenever you click "Run workflow".
# PLUTO only updates a few times a year, so a monthly check is plenty — the job
# only commits when the exported GeoJSON actually changed.
on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

# Let the job commit the refreshed data back to the repo.
permissions:
  contents: write

# Don't let two refreshes overlap.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh all borough data
        run: python data-prep/refresh.py

      - name: Commit refreshed GeoJSON if it changed
        run: |
          if [ -n "$(git status --porcelain docs/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/data
            git commit -m "Refresh PLUTO data ($(date -u +%Y-%m-%d))"
            git push
            echo "Committed refreshed data. GitHub Pages will redeploy automatically."
          else
            echo "No data changes — nothing to commit."
          fi
