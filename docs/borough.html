<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NYC Building Ages</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Analytics -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="eb8b3ced-1390-46e0-b9a3-fbae9fa82bf5"
    ></script>

    <!-- Generic on purpose: scrapers never run the JS that sets the real title.
         og:url and canonical are omitted so borough links don't collapse to one. -->
    <meta
      name="description"
      content="Explore a New York City borough building by building, colored by the decade each one went up."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="When Was New York Built?" />
    <meta property="og:title" content="When Was New York Built?" />
    <meta
      property="og:description"
      content="Explore a New York City borough building by building, colored by the decade each one went up."
    />
    <meta property="og:image" content="https://whenwasbuilt.nyc/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Silhouette of New York City's five boroughs in coral on a blue field, beside a colour scale running from aqua for buildings from before 1900 to midnight navy for the 2020s."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="When Was New York Built?" />
    <meta
      name="twitter:description"
      content="Explore a New York City borough building by building, colored by the decade each one went up."
    />
    <meta
      name="twitter:image"
      content="https://whenwasbuilt.nyc/og-image.png"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header detail-header">
      <a class="back" href="index.html">← All boroughs</a>
      <h1 id="borough-title">Loading…</h1>

      <div class="search">
        <input
          id="search-input"
          class="search-input"
          type="text"
          role="combobox"
          aria-expanded="false"
          aria-controls="search-results"
          aria-autocomplete="list"
          aria-label="Search this borough by address"
          placeholder="Search this borough…"
          autocomplete="off"
        />
        <ul
          id="search-results"
          class="search-results"
          role="listbox"
          aria-label="Matching addresses"
          hidden
        ></ul>
      </div>

      <span id="count" class="count"></span>
    </header>

    <div
      id="map"
      class="map"
      role="region"
      aria-label="Map of buildings, colored by the decade they were built"
    ></div>

    <!-- The map is canvas; this carries the same figures as text. -->
    <p id="map-summary" class="visually-hidden" role="status"></p>

    <div class="controls">
      <button
        id="play"
        class="play"
        type="button"
        aria-label="Play through the decades"
      >
        ▶
      </button>
      <input
        id="slider"
        class="slider"
        type="range"
        step="10"
        aria-label="Show buildings built up to this decade"
      />
      <div id="status" class="slider-label">Showing all buildings</div>
    </div>

    <div id="legend" class="legend"></div>

    <select
      id="legend-select"
      class="legend-select"
      aria-label="Filter buildings by time period"
    ></select>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="colors.js"></script>
    <script src="zoning.js"></script>
    <script src="borough.js"></script>
  </body>
</html>
