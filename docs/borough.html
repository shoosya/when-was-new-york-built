<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NYC Building Ages</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Analytics -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="eb8b3ced-1390-46e0-b9a3-fbae9fa82bf5"
    ></script>

    <!-- Link previews. Generic on purpose: borough.js sets the real title from
         ?borough=, which scrapers never run. og:url and canonical are omitted so
         every borough's link doesn't collapse to one URL. -->
    <meta
      name="description"
      content="Explore a New York City borough building by building, colored by the decade each one went up."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="When Was New York Built?" />
    <meta property="og:title" content="When Was New York Built?" />
    <meta
      property="og:description"
      content="Explore a New York City borough building by building, colored by the decade each one went up."
    />
    <meta property="og:image" content="https://whenwasbuilt.nyc/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Silhouette of New York City's five boroughs beside a dark-red-to-yellow color scale running from before 1900 to the 2020s."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="When Was New York Built?" />
    <meta
      name="twitter:description"
      content="Explore a New York City borough building by building, colored by the decade each one went up."
    />
    <meta
      name="twitter:image"
      content="https://whenwasbuilt.nyc/og-image.png"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header detail-header">
      <a class="back" href="index.html">← All boroughs</a>
      <h1 id="borough-title">Loading…</h1>
      <span id="count" class="count"></span>
    </header>

    <div id="map" class="map"></div>

    <!-- Decade "rewind" control -->
    <div class="controls">
      <button
        id="play"
        class="play"
        type="button"
        aria-label="Play through the decades"
      >
        ▶
      </button>
      <input id="slider" class="slider" type="range" step="10" />
      <div id="status" class="slider-label">Showing all buildings</div>
    </div>

    <!-- Color legend + period filter (list on desktop) -->
    <div id="legend" class="legend"></div>

    <!-- Same period filter as a dropdown, shown only on narrow screens -->
    <select
      id="legend-select"
      class="legend-select"
      aria-label="Filter buildings by time period"
    ></select>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="colors.js"></script>
    <script src="zoning.js"></script>
    <script src="borough.js"></script>
  </body>
</html>
