<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NYC Building Ages — Explore by borough</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Analytics -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="eb8b3ced-1390-46e0-b9a3-fbae9fa82bf5"
    ></script>

    <!-- Link previews. URLs are absolute — scrapers don't resolve relative ones. -->
    <meta
      name="description"
      content="An interactive map of New York City showing when each building was constructed — every lot colored by the decade it went up."
    />
    <link rel="canonical" href="https://whenwasbuilt.nyc/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="When Was New York Built?" />
    <meta property="og:url" content="https://whenwasbuilt.nyc/" />
    <meta property="og:title" content="When Was New York Built?" />
    <meta
      property="og:description"
      content="An interactive map of New York City showing when each building was constructed — every lot colored by the decade it went up."
    />
    <meta property="og:image" content="https://whenwasbuilt.nyc/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Silhouette of New York City's five boroughs in coral on a blue field, beside a colour scale running from aqua for buildings from before 1900 to midnight navy for the 2020s."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="When Was New York Built?" />
    <meta
      name="twitter:description"
      content="An interactive map of New York City showing when each building was constructed — every lot colored by the decade it went up."
    />
    <meta
      name="twitter:image"
      content="https://whenwasbuilt.nyc/og-image.png"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <img class="site-logo" src="logo.svg" alt="" width="42" height="42" />
      <div>
        <h1>When Was New York Built?</h1>
        <p>
          Pick a borough to explore its buildings by the decade they went up.
        </p>
      </div>
    </header>

    <div
      id="map"
      class="map"
      role="region"
      aria-label="Map of New York City's five boroughs"
    ></div>

    <footer class="site-footer">
      <span class="footer-author">
        Created by
        <a href="https://github.com/shoosya" target="_blank" rel="noopener"
          >Natalie Kay</a
        >

          class="bmc-link"
          href="https://buymeacoffee.com/shoosya"
          target="_blank"
          rel="noopener"
          >Buy Me A Coffee ☕️</a
        >
      </span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="overview.js"></script>
  </body>
</html>
